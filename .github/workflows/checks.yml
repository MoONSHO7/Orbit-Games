name: Checks

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lua 5.1 and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check -r Dev/Tests/requirements.txt

      - name: Install StyLua
        env:
          STYLUA_VERSION: v2.3.1
          STYLUA_SHA256: f0cfea40b3d72223497fa1650061f866e0d19a93a871aae22d3849f1bc9c2722
        run: |
          archive="$RUNNER_TEMP/stylua.zip"
          install_dir="$RUNNER_TEMP/stylua"
          curl --fail --location --silent --show-error \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/$STYLUA_VERSION/stylua-linux-x86_64.zip" \
            --output "$archive"
          echo "$STYLUA_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/stylua"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check Lua formatting
        run: stylua --check --output-format Summary .

      - name: Run offline regression checks
        run: python -B -u Dev/Tests/run.py
